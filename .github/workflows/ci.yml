name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install 7-Zip
        run: |
          sudo apt-get update
          sudo apt-get install -y 7zip || sudo apt-get install -y p7zip-full
          echo "--- resolved 7-Zip binaries ---"
          for b in 7zz 7z 7za; do
            if command -v "$b" >/dev/null; then
              echo "$b -> $(command -v "$b")"; "$b" 2>/dev/null | head -2
            else
              echo "$b: absent"
            fi
          done

      - name: Start Azurite
        run: |
          npx -y -p azurite azurite-blob --skipApiVersionCheck --blobPort 10000 &
          ready=0
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:10000/devstoreaccount1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Azurite failed to become reachable on 127.0.0.1:10000" >&2
            exit 1
          fi

      - name: Test (incl. integration)
        run: cd backend && dotnet test -c Release

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build
        run: cd frontend && npm run build

      - name: Lint
        run: cd frontend && npm run lint
