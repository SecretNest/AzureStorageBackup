name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install 7-Zip
        # The latest official release, the very same thing the Dockerfile installs into the image.
        # The distro-packaged 7zip/p7zip writes entry attributes as 0 when compressing from stdin
        # (extraction gives ----------), so its results would not represent production.
        # The legacy-archive path is covered by Fixtures/zero-attr-si.7z and does not depend on
        # whichever version gets installed here.
        run: |
          set -eux
          ver="$(curl -fsSL https://www.7-zip.org/download.html \
                 | grep -oE '7z[0-9]{4}-linux-x64\.tar\.xz' | grep -oE '[0-9]{4}' | sort -rn | head -1)"
          test -n "$ver"
          curl -fsSL -o /tmp/7z.tar.xz "https://www.7-zip.org/a/7z${ver}-linux-x64.tar.xz"
          sudo tar -xJf /tmp/7z.tar.xz -C /usr/local/bin 7zz
          7zz | head -2

      - name: Start Azurite
        # Installed first, on its own line, so the readiness wait below measures Azurite starting and not
        # npm downloading it. The two used to share one 30-second budget, and on a slow registry day the
        # download alone ate it twice in a row — the loop gave up on a process that had not even been
        # handed its command line yet. Pinned, so a new Azurite release cannot change what the suite
        # runs against without a commit saying so.
        run: |
          npm install -g azurite@3.37.0
          azurite-blob --skipApiVersionCheck --blobPort 10000 --location "$RUNNER_TEMP/azurite" &
          ready=0
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://127.0.0.1:10000/devstoreaccount1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Azurite failed to become reachable on 127.0.0.1:10000" >&2
            exit 1
          fi

      - name: Test (incl. integration)
        run: cd backend && dotnet test -c Release

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build
        run: cd frontend && npm run build

      - name: Lint
        run: cd frontend && npm run lint
