name: Build and publish Docker image

# Manual trigger only.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish"
        required: true
        default: latest

env:
  IMAGE: ghcr.io/secretnest/azurestoragebackup
  ACR_IMAGE: ${{ secrets.ACR_REGISTRY }}/secretnest/azurestoragebackup

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # The build itself always finishes within ten minutes; if it stalls, it is the cache backend
    # and not the build, so do not let it hang for the default 6 hours.
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.IMAGE }}
            ${{ env.ACR_IMAGE }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=sha

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Keep the cache in GHCR, not in GitHub Actions Cache. The type=gha export runs **after**
          # the image push, and a single two-architecture mode=max run crushes it: on 2026-08-06 the
          # image had long been pushed, yet the export sat there for eleven minutes and had to be
          # cancelled by hand -- by which point everything that needed publishing was already
          # published.
          # ignore-error is the second safety net: failing to write the cache should not turn a
          # successful publish red.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true
