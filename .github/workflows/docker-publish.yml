name: Build and publish Docker image

# Manual trigger only.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish"
        required: true
        default: latest

env:
  IMAGE: ghcr.io/secretnest/azurestoragebackup
  ACR_IMAGE: ${{ secrets.ACR_REGISTRY }}/secretnest/azurestoragebackup

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # 构建本身十分钟内必完；卡住的话是缓存后端而不是构建，别让它挂满默认的 6 小时。
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.IMAGE }}
            ${{ env.ACR_IMAGE }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=sha

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 缓存放 GHCR，不放 GitHub Actions Cache。type=gha 的导出跑在镜像推送**之后**，
          # 一次双架构 mode=max 就把它压垮了：2026-08-06 那次镜像早已推完，导出却原地停了
          # 十一分钟，只能手动取消——而那时该发布的东西其实全都发布好了。
          # ignore-error 是第二道保险：缓存写不进去不该让一次成功的发布报红。
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true
