name: Build and publish Docker image

# Manual trigger only.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish. Leave empty to use <Version> from the API csproj."
        required: false

env:
  IMAGE: ghcr.io/secretnest/azurestoragebackup
  ACR_IMAGE: ${{ secrets.ACR_REGISTRY }}/secretnest/azurestoragebackup

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # The build itself always finishes within ten minutes; if it stalls, it is the cache backend
    # and not the build, so do not let it hang for the default 6 hours.
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # The version lives in the csproj so that it is reviewable in git and ends up in the assembly
      # too, rather than being typed into the dispatch form and forgotten.
      - name: Resolve version
        id: version
        # Passed through env, not interpolated into the script: ${{ }} substitution happens before
        # the shell ever sees the line, so a crafted input would be executed rather than validated.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          v="$INPUT_VERSION"
          if [ -z "$v" ]; then
            v="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' \
                 backend/src/AzureStorageBackup.Api/AzureStorageBackup.Api.csproj | head -1)"
          fi
          # Refuse to publish an untagged or malformed build rather than silently shipping "latest" alone.
          case "$v" in
            '') echo "::error::No version found in the csproj and none supplied."; exit 1 ;;
            *[!0-9.]*|.*|*.) echo "::error::Version '$v' is not a dotted numeric version."; exit 1 ;;
          esac
          echo "Publishing version $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # No type=sha: it minted one throwaway tag per build, which is how GHCR accumulated 88 of them.
      # Two tags per release is the whole set — the version, and latest moved onto it.
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.IMAGE }}
            ${{ env.ACR_IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Both off on purpose, and stated rather than left to the action's default. Attestations are
          # pushed as an OCI manifest carrying an `application/vnd.oci.empty.v1+json` descriptor, which
          # ACR rejects outright ("denied: unknown manifest class"). On 2026-08-13 the action -- a
          # floating v7 tag -- started passing `--attest type=provenance,mode=max` where the 2026-08-11
          # run had passed nothing, and the publish died at the ACR push with the GHCR half already
          # live. Turning the default off here means the next such drift cannot split the two registries
          # again.
          provenance: false
          sbom: false
          # Keep the cache in GHCR, not in GitHub Actions Cache. The type=gha export runs **after**
          # the image push, and a single two-architecture mode=max run crushes it: on 2026-08-06 the
          # image had long been pushed, yet the export sat there for eleven minutes and had to be
          # cancelled by hand -- by which point everything that needed publishing was already
          # published.
          # ignore-error is the second safety net: failing to write the cache should not turn a
          # successful publish red.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true
